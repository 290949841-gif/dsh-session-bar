name: machong199412345-coder/dsh-session-bar
category: session
tarball: https://registry.npmjs.org/dsh-session-bar/-/dsh-session-bar-0.1.0.tgz
description:
  zh: "侧栏会话状态条：会话跑起来时整行变成绿色卡片，底部一条带流动小点的进度条按估算时长推进，行首直接显示完成百分比，超时精确到已用时长；跑完后整行转橙并一直亮着，直到你点开那条对话才熄灭。不用切过去看，瞄一眼侧栏就知道每条会话在干嘛。"
  en: "A status bar for the DSH sidebar: while a session is running the row becomes a green card with an estimated-cost-driven progress bar (animated dotted track) and a live percentage on the leading edge, switching to elapsed mm:ss once the estimate is exceeded; when it finishes the row turns orange and stays lit until you actually open that conversation. Pure client-side, no extra services, two localStorage keys."
